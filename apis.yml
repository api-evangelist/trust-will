aid: trust-will
name: Trust & Will
description: 'Trust & Will is a San Diego-based digital estate planning and probate
  company that lets individuals and families create legally valid wills, revocable
  living trusts, guardianship documents and probate filings online, with attorney-drafted
  state-specific documents and notarization support. Alongside its direct-to-consumer
  product it runs an enterprise and professional channel — EstateOS, plus programs
  for financial advisors, estate attorneys, nonprofits, banks and credit unions —
  that embeds estate planning into partner client experiences. The company reports
  more than one million members and 200+ enterprise partners including AARP, Fifth
  Third Bank, LPL Financial, UBS and USAA. Its EstateOS launch announcement states
  that an open API, MCP server and SDKs for enterprise integration are planned, but
  as of this profile no public developer portal, API reference or machine-readable
  specification is published — partner integration runs through a sales and partnership
  conversation.'
